name: Bazel SymCrypt packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: SymCrypt (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    defaults:
      run:
        shell: bash
    steps:
      - name: Install validation and archive tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates curl gdb git libxml2 patch python3 tar unzip xz-utils zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Draft validation consumes the exact reviewed tool sources. Ordinary
      # registry selection remains maintained main plus BCR in .bazelrc.
      - name: Check out the declared build tools and compiler fixes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-build-infra
          ref: 1f3e526a29e5fc391b42b11925a41889a44aa7a0
          path: _ci/infra
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: symcrypt-${{ matrix.architecture }}
          cache-version: "8.5.1"
      - name: Build and check installed runtime and debug packages
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test ! -e MODULE.bazel.lock
          test -z "$(git -c safe.directory="$GITHUB_WORKSPACE" ls-files MODULE.bazel.lock)"
          git -c safe.directory="$GITHUB_WORKSPACE" check-ignore MODULE.bazel.lock
          python3 -B tools/bazel/symcrypt_ci.py --architecture '${{ matrix.architecture }}' --artifacts artifacts/symcrypt \
            --bazel-arg="--override_module=sonic-build-infra=$GITHUB_WORKSPACE/_ci/infra"
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code
      - name: Upload packages, logs and source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symcrypt-${{ matrix.architecture }}
          path: artifacts/symcrypt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
